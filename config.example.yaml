# OPTIONAL. The bot needs no config file: claim it with the setup code and
# configure it over the mesh by DM (see README). If you'd rather use a file, copy
# this to /etc/meshbot/config.yaml. Settings made over the mesh take precedence.
# Anything left out uses the defaults in meshymcmeshbot/config.py.

radio:
  port: auto                # or a device like /dev/ttyACM0

bot:
  name: "MeshyMcMeshBot"    # node name the radio advertises
  channel: "#mycounty"      # channel it posts on; a #hashtag is added to the radio. Never Public.
  prefix: "!"               # channel commands look like "!wx"
  # Admin public keys (12+ hex chars). Usually set by 'claim' over the mesh instead.
  # admins:
  #   - "a1b2c3d4e5f6"
  quiet_hours: { start: "22:30", end: "05:30" }   # scheduled posts pause; alerts don't

location:
  # zip: "68102"            # quote it! Fills in lat/lon, timezone and the area name.
  # Optional overrides (otherwise looked up from the ZIP):
  # name: "Douglas County"  # used in welcomes and `about`
  # lat: 41.2565
  # lon: -95.9345
  # timezone: America/Chicago

weather:
  user_agent: "MeshyMcMeshBot (you@example.com)"   # NWS asks for contact info
  post_times: ["06:00", "10:00", "14:00", "18:00", "22:00"]
  alerts:
    min_severity: Severe    # Minor | Moderate | Severe | Extreme

news:
  post_times: ["08:00", "17:00"]
  feeds:
    # Local paper / county / school district RSS feeds. Examples:
    # - { name: "County", url: "https://www.example-county.gov/RSSFeed.aspx?ModID=1" }
    # - { name: "Herald", url: "https://www.example-herald.com/feed/" }

events:
  post_times: ["07:30"]
  ical_urls:
    # A public Google Calendar: Settings > Integrate calendar > "Public address in iCal format"
    # - "https://calendar.google.com/calendar/ical/xxxx%40group.calendar.google.com/public/basic.ics"

stats:
  post_times: ["21:00"]     # nightly "mesh today" digest; [] to disable

welcome:
  settle_days: 3            # after a fresh install, wait before greeting "new" nodes
  # message: "👋 Welcome to the {area} mesh, {name}! ..."

repeaters:
  # MeshCore repeaters to watch: public-key prefixes (8+ hex) or exact names.
  watch: []
  #  - "Hilltop Rptr"
  #  - "a1b2c3d4"
  offline_hours: 24
  notify: admins            # admins (DM) | channel

quakes:
  radius_km: 250
  min_magnitude: 3.0

rivers:
  # Gauge IDs from https://water.noaa.gov - search your river, the ID is in the URL.
  gauges: []
  #  - "OMHN1"
  alert_category: minor     # action | minor | moderate | major

air:
  airnow_api_key: ""        # optional: free key from https://docs.airnowapi.org
  alert_aqi: 151
